<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soul Orbit - Celestial Resonance</title>
    <meta name="description" content="An atmospheric, generative simulation of soul fragments seeking resonance with the central stellar core.">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Space+Grotesk:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1 class="title">Can the souls achieve resonance?</h1>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </header>

        <div id="game-wrapper">
            <canvas id="canvas" width="360" height="540"></canvas>
            
            <div id="timer-overlay" class="timer-overlay">
                <div id="timer" class="stat-value font-mono">15.00s</div>
            </div>
            
            <div id="overlay" class="overlay">
                <div class="overlay-content">
                    <div class="glow-orb-menu"></div>
                    <h2 id="overlay-title">CELESTIAL RESONANCE</h2>
                    <p id="overlay-desc">Observe the generative dance of soul fragments as they synchronize, leap orbits, and seek unity with the stellar core.</p>
                    <button id="action-btn">OBSERVE RESONANCE</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
