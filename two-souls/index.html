<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lonely Souls</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button id="fullscreen-btn" class="fullscreen-btn" aria-label="Toggle Fullscreen">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4" />
        </svg>
    </button>
    <div class="label label-top">Can <span style="color: #ff3333;">red</span> and <span style="color: #3333ff;">blue</span> souls find each other before time runs out?</div>

    <div id="container">
        <canvas id="canvas" width="360" height="360"></canvas>
        <div id="startScreen">
            <button id="startBtn">START</button>
        </div>
    </div>

    <div id="timer">--:--</div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
