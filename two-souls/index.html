<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lonely Souls</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="label label-top">Can <span style="color: #ff3333;">red</span> and <span style="color: #3333ff;">blue</span> souls find each other before time runs out?</div>

    <div id="container">
        <canvas id="canvas" width="360" height="360"></canvas>
        <div id="startScreen">
            <button id="startBtn">START</button>
        </div>
    </div>

    <div id="timer">--:--</div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
